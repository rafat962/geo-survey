<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>تطبيق التنفيذ الميداني</title>

  <!-- ArcGIS Maps SDK for JavaScript v4.30 (CDN) -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-app-mode="exec">
  <!-- Full-Screen ArcGIS MapView -->
  <div id="viewDiv"></div>

  <!-- Top Progress & Status HUD -->
  <header class="top-hud">
    <div class="hud-card progress-card">
      <div class="hud-top-row">
        <div class="progress-header">
          <span id="progressText">جاري تحميل نقاط التنفيذ...</span>
          <span id="progressPercent" class="progress-percent">0%</span>
        </div>
        <div class="user-actions">
          <span id="userBadge" class="user-badge" hidden></span>
          <button id="btnLogout" class="btn-logout" type="button" title="تسجيل الخروج">
            خروج
          </button>
        </div>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div class="hud-status-strip">
      <div id="offlineBanner" class="offline-banner" hidden>
        📡 وضع بدون إنترنت — يتم الحفظ محلياً
      </div>
      <button id="outboxPillBtn" class="outbox-pill" type="button" hidden>
        <span class="outbox-pill-label">
          <span>📤</span>
          <span id="outboxCountText">0 مهام بانتظار الرفع</span>
        </span>
        <span id="outboxActionHint" class="outbox-action-hint">عرض / رفع</span>
      </button>
    </div>

    <div id="demoBadge" class="demo-pill">
      وضع تجريبي للتنفيذ
    </div>
  </header>

  <!-- Bottom-Left Grouped Controls: Fullscreen + My Location -->
  <div class="fab-group-left" role="group" aria-label="أدوات الموقع والعرض">
    <button id="btnFullscreen" class="fab-icon-btn" type="button" title="ملء الشاشة" aria-label="ملء الشاشة">
      <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
    </button>
    <button id="btnMyLocation" class="fab-icon-btn" type="button" title="موقعي الحالي" aria-label="موقعي الحالي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
        <circle cx="12" cy="12" r="7" stroke-opacity="0.4"></circle>
      </svg>
    </button>
  </div>

  <!-- Bottom-Right Control: Zoom to All Points -->
  <div class="fab-stack">
    <button id="btnZoomAll" class="fab-btn" type="button" title="عرض جميع النقاط">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
      </svg>
      <span>كل النقاط</span>
    </button>
  </div>

  <!-- Setup Modal (kept hidden unless explicitly launched with ?demo=1) -->
  <div id="setupModal" class="setup-modal" hidden>
    <div class="setup-card">
      <h2>إعداد طبقة التنفيذ الميداني</h2>
      <p>يمكنك تجربة واجهة التنفيذ الآن ببيانات افتراضية للمعاينة.</p>
      <div class="setup-actions">
        <button id="btnStartDemo" class="btn-primary blue" type="button">
          تشغيل الوضع التجريبي (Demo)
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Bottom Sheet Backdrop -->
  <div id="sheetBackdrop" class="sheet-backdrop"></div>

  <!-- Mobile Bottom Sheet Form (Execution Mode: Stage + Notes + Multi-Photos) -->
  <section
    id="bottomSheet"
    class="bottom-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sheetTitle"
  >
    <div class="sheet-handle-bar">
      <div class="sheet-handle"></div>
    </div>

    <div class="sheet-header">
      <div class="sheet-title-group">
        <h2 id="sheetTitle" class="sheet-title">نقطة رقم --</h2>
        <span id="sheetStatusBadge" class="status-badge pending">قيد الانتظار</span>
      </div>
      <div class="sheet-header-actions">
        <a
          id="btnSheetGoogleMaps"
          class="btn-sheet-maps"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        >
          🗺️ خرائط جوجل
        </a>
        <button id="btnCloseSheet" class="btn-close-sheet" type="button" aria-label="إغلاق">
          ✕
        </button>
      </div>
    </div>

    <form id="pointForm" class="sheet-body" novalidate>
      <!-- 1. مرحلة التنفيذ -->
      <div class="form-field">
        <label class="form-label" for="fieldExecStage">
          المرحلة <span class="required-mark">*</span>
        </label>
        <select
          id="fieldExecStage"
          name="stage"
          class="form-control"
          required
        >
          <option value="" disabled selected>-- اختر المرحلة --</option>
          <option value="حفر واستلام حفر">حفر واستلام حفر</option>
          <option value="تسليح">تسليح</option>
          <option value="صب">صب</option>
          <option value="عزل">عزل</option>
          <option value="اعاده الوضع لاصله">اعاده الوضع لاصله</option>
        </select>
      </div>

      <!-- 2. الملاحظات -->
      <div class="form-field">
        <label class="form-label" for="fieldExecNotes">الملاحظات</label>
        <textarea
          id="fieldExecNotes"
          name="notes"
          rows="3"
          class="form-control"
          placeholder="أدخل الملاحظات..."
        ></textarea>
      </div>

      <div id="existingPhotosSection" class="form-field" hidden>
        <div class="photo-header-row">
          <label class="form-label">الصور المرفقة سابقاً</label>
          <span id="existingPhotosCountLabel" class="photo-count-label existing" hidden>0 صور</span>
        </div>
        <div id="existingPhotosList" class="photo-gallery"></div>
        <div id="existingPhotosUndoBar" class="undo-delete-bar" hidden>
          <span id="existingPhotosDeleteNotice"></span>
          <button id="btnUndoDeletePhotos" class="btn-undo-delete" type="button">تراجع</button>
        </div>
      </div>

      <!-- 3. الصور (متعدد) -->
      <div class="form-field">
        <div class="photo-header-row">
          <label class="form-label">صور التنفيذ (متعدد)</label>
          <span id="photoCountLabel" class="photo-count-label" hidden>0 صور</span>
        </div>
        <div class="photo-box">
          <input
            id="photoInput"
            type="file"
            accept="image/*"
            capture="environment"
            multiple
            hidden
          />
          <button id="btnPickPhoto" class="btn-camera" type="button">
            📷 إضافة صورة أخرى / التقاط صورة
          </button>

          <div id="photoGallery" class="photo-gallery" hidden></div>
        </div>
      </div>

      <div id="formError" class="form-error" role="alert"></div>
    </form>

    <div class="sheet-footer">
      <button id="btnSubmitForm" class="btn-primary" type="submit" form="pointForm">
        <span id="submitSpinner" class="spinner"></span>
        <span id="submitBtnText">حفظ وإتمام النقطة</span>
      </button>
    </div>
  </section>

  <!-- Offline Outbox Sync Drawer -->
  <div id="outboxBackdrop" class="sheet-backdrop outbox-backdrop"></div>
  <section
    id="outboxSheet"
    class="bottom-sheet outbox-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="outboxSheetTitle"
  >
    <div class="sheet-handle-bar">
      <div class="sheet-handle"></div>
    </div>

    <div class="sheet-header">
      <div class="sheet-title-group">
        <h2 id="outboxSheetTitle" class="sheet-title">المهام المعلقة للرفع</h2>
        <span id="outboxNetBadge" class="status-badge pending">متصل</span>
      </div>
      <button id="btnCloseOutbox" class="btn-close-sheet" type="button" aria-label="إغلاق">
        ✕
      </button>
    </div>

    <div class="outbox-top-actions">
      <button id="btnSyncAll" class="btn-primary" type="button">
        <span id="syncAllSpinner" class="spinner"></span>
        <span id="syncAllBtnText">☁️ رفع الكل مرة واحدة</span>
      </button>
      <div id="outboxSyncStatus" class="outbox-sync-status" hidden></div>
    </div>

    <div id="outboxList" class="sheet-body outbox-list"></div>
  </section>

  <!-- In-App Fullscreen Photo Viewer -->
  <div id="photoViewerModal" class="photo-viewer-modal" role="dialog" aria-modal="true" aria-label="عرض الصورة" hidden>
    <div class="photo-viewer-header">
      <span id="photoViewerCaption" class="photo-viewer-caption">معاينة الصورة</span>
      <button id="btnClosePhotoViewer" class="btn-close-viewer" type="button" aria-label="إغلاق المعاينة">
        ✕
      </button>
    </div>
    <div class="photo-viewer-stage">
      <img id="photoViewerImg" class="photo-viewer-img" src="" alt="معاينة الصورة" />
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://js.arcgis.com/4.30/"></script>
  <script src="../js/config.js"></script>
  <script src="../js/offline-db.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
