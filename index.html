<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f8fafc" />
  <title>تسجيل الدخول | تطبيق المسح الميداني</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <header class="brand-header">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-6-5.33-6-11a6 6 0 1 1 12 0c0 5.67-6 11-6 11z"></path>
            <circle cx="12" cy="10" r="2.2"></circle>
          </svg>
        </div>
        <h1 id="loginTitle" class="brand-title">تطبيق المسح الميداني</h1>
        <p class="brand-subtitle">سجّل الدخول للوصول إلى خريطة المهام وتتبع المسار</p>
      </header>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field-group">
          <label for="username" class="field-label">اسم المستخدم</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              id="username"
              name="username"
              type="text"
              class="field-input"
              placeholder="أدخل اسم المستخدم"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label for="password" class="field-label">كلمة المرور</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              class="field-input has-toggle"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password"
              required
            />
            <button
              id="togglePassword"
              class="btn-eye"
              type="button"
              aria-label="إظهار كلمة المرور"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label" for="rememberMe">
            <input id="rememberMe" type="checkbox" class="remember-checkbox" />
            <span>تذكرني على هذا الجهاز</span>
          </label>
        </div>

        <div id="loginError" class="error-box" role="alert"></div>

        <button id="btnLogin" type="submit" class="btn-submit">
          <span id="loginSpinner" class="spinner"></span>
          <span id="loginBtnLabel">تسجيل الدخول</span>
        </button>
      </form>

      <footer class="login-footer">
        بوابة العمل الميداني المحمية — التحقق عبر Cloudflare Worker
      </footer>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
